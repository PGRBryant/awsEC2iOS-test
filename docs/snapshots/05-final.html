<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SimDensity Dashboard</title>
<style>
:root {
  --ground:#f4f6f8; --surface:#ffffff; --ink:#171b21; --ink-soft:#3c434e;
  --muted:#667080; --line:#d9dee4; --grid:#e7ebef;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ground:#0f1216; --surface:#171b21; --ink:#eaeef3; --ink-soft:#c2cad3;
  --muted:#8a94a2; --line:#2a313a; --grid:#232a33;
} }
:root[data-theme="dark"] {
  --ground:#0f1216; --surface:#171b21; --ink:#eaeef3; --ink-soft:#c2cad3;
  --muted:#8a94a2; --line:#2a313a; --grid:#232a33;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:28px 22px 80px}
h1{font-size:22px;letter-spacing:-.01em;margin:0}
.sub{font-family:var(--mono);font-size:12px;color:var(--muted);margin:4px 0 22px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:22px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.tile .v{font-family:var(--mono);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.tile .n{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:4px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
figure{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0}
figcaption{font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
figcaption .note,.legend{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin:0 4px 0 10px}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--muted) 0 4px,transparent 4px 7px)}
svg{width:100%;height:auto;display:block}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--line);stroke-width:1}
.tick{font:10.5px var(--mono);fill:var(--muted)}
.dlabel{font:11px var(--mono);fill:var(--ink-soft);font-weight:600}
.dot{stroke:var(--surface);stroke-width:2}
.hit{fill:transparent;cursor:crosshair}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:420px}
th,td{text-align:left;padding:6px 12px;border-bottom:1px solid var(--line)}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.chip{font-family:var(--mono);font-size:10.5px;background:#c53030;color:#fff;border-radius:99px;padding:1px 8px}
.tablefig,.results,.edgeai{margin-top:14px}
.edgeai .facts{margin:12px 0 2px;padding-left:20px;font-size:13px;color:var(--ink-soft)}
.edgeai .facts li{margin-bottom:6px}
.edgeai .facts code{font-family:var(--mono);font-size:12px;color:var(--ink)}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--ground);
  font:11.5px var(--mono);padding:5px 9px;border-radius:6px;opacity:0;transition:opacity .12s;z-index:9;white-space:nowrap}
</style></head><body>

<figure class="edgeai"><figcaption>Inside the edge-AI (INFER) profile<span class="note">what every simulator is actually doing under AI load</span></figcaption><div class="scroll"><svg viewBox="0 0 1140 118" style="min-width:820px" role="img" aria-label="Edge-AI pipeline: synthesize image, Vision OCR, verify, metrics, collect"><rect x="1" y="12" width="188" height="92" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/><text x="95.0" y="42" text-anchor="middle" style="font:600 13px var(--mono)" fill="var(--ink-soft)">SYNTHESIZE</text><text x="95.0" y="63" text-anchor="middle" style="font:11px var(--mono)" fill="var(--muted)">unique text image</text><text x="95.0" y="80" text-anchor="middle" style="font:11px var(--mono)" fill="var(--muted)">per iteration</text><rect x="231" y="12" width="238" height="92" rx="10" fill="var(--surface)" stroke="#0d8f86" stroke-width="2"/><text x="350.0" y="42" text-anchor="middle" style="font:600 13px var(--mono)" fill="#0d8f86">VISION OCR</text><text x="350.0" y="63" text-anchor="middle" style="font:11px var(--mono)" fill="var(--muted)">VNRecognizeTextRequest</text><text x="350.0" y="80" text-anchor="middle" style="font:11px var(--mono)" fill="var(--muted)">on-device neural net</text><rect x="511" y="12" width="178" height="92" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/><text x="600.0" y="42" text-anchor="middle" style="font:600 13px var(--mono)" fill="var(--ink-soft)">VERIFY</text><text x="600.0" y="63" text-anchor="middle" style="font:11px var(--mono)" fill="var(--muted)">result must contain</text><text x="600.0" y="80" text-anchor="middle" style="font:11px var(--mono)" fill="var(--muted)">recognized text</text><rect x="731" y="12" width="178" height="92" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/><text x="820.0" y="42" text-anchor="middle" style="font:600 13px var(--mono)" fill="var(--ink-soft)">METRICS</text><text x="820.0" y="63" text-anchor="middle" style="font:11px var(--mono)" fill="var(--muted)">metrics.json in the</text><text x="820.0" y="80" text-anchor="middle" style="font:11px var(--mono)" fill="var(--muted)">app's sandbox</text><rect x="951" y="12" width="188" height="92" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/><text x="1045.0" y="42" text-anchor="middle" style="font:600 13px var(--mono)" fill="var(--ink-soft)">COLLECT</text><text x="1045.0" y="63" text-anchor="middle" style="font:11px var(--mono)" fill="var(--muted)">simctl get_app_container</text><text x="1045.0" y="80" text-anchor="middle" style="font:11px var(--mono)" fill="var(--muted)">→ CSV → charts</text><line x1="194" y1="58" x2="220" y2="58" stroke="var(--muted)" stroke-width="1.5"/><path d="M 220 53 L 227 58 L 220 63 Z" fill="var(--muted)"/><line x1="474" y1="58" x2="500" y2="58" stroke="var(--muted)" stroke-width="1.5"/><path d="M 500 53 L 507 58 L 500 63 Z" fill="var(--muted)"/><line x1="694" y1="58" x2="720" y2="58" stroke="var(--muted)" stroke-width="1.5"/><path d="M 720 53 L 727 58 L 720 63 Z" fill="var(--muted)"/><line x1="914" y1="58" x2="940" y2="58" stroke="var(--muted)" stroke-width="1.5"/><path d="M 940 53 L 947 58 L 940 63 Z" fill="var(--muted)"/></svg></div><ul class="facts"><li><b>Real neural inference, not a stand-in:</b> each iteration runs Apple's Vision text-recognition network (<code>VNRecognizeTextRequest</code>, fast path) inside the simulator — the same API an app ships with for on-device AI.</li><li><b>Zero bundled models:</b> the network ships with the OS, so the test app stays tiny and install times stay honest.</li><li><b>Every inference is verified:</b> an iteration only counts when the recognizer returns actual text from the synthesized image — no idle-loop inflation.</li><li><b>Throughput is the metric:</b> each sim reports its inferences/sec; the harness aggregates across N sims to find where added simulators stop adding AI throughput — the capacity-planning number for edge-AI test suites.</li><li><b>The &ldquo;Not Hotdog&rdquo; protocol (HOTDOG profile):</b> a second, harder model class — Vision's built-in ~1,300-label image classifier (<code>VNClassifyImageRequest</code>) judges generated hotdog-vs-decoy images against known ground truth, half the decoys adversarial foods. Only <i>correct</i> verdicts count, so this curve measures <b>accuracy under load</b>, not just speed.</li></ul></figure>
